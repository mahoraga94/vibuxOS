[workspace]
resolver = "3"
members = ["kernel"]

[package]
name = "vibuxos"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
bootloader = {
    version = "0.11.17",
    default-features = false,
    features = ["bios"]
}
kernel = {
    path = "kernel",
    artifact = "bin",
    target = "x86_64-unknown-none"
}

[profile.dev]
opt-level = 0
debug = 1
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256
incremental = true
panic = "abort"
strip = "none"

[profile.dev.build-override]
opt-level = 0
debug = false
codegen-units = 256
incremental = true
strip = "none"

# ============================================================
# NATIVE
# Maximum runtime optimization for THIS machine.
# CPU target is injected by .cargo/bin/cargo.
# ============================================================


# ============================================================
# ME — BOI'S FIXED HASWELL PERFORMANCE PROFILE
# Intel Core i5-4570T / Haswell only.
# ============================================================
[profile.me]
inherits         = "release"
opt-level        = 3
debug            = false
debug-assertions = false
overflow-checks  = false
lto              = "fat"
codegen-units    = 1
incremental      = false
panic            = "abort"
strip            = "symbols"
rpath            = false

[profile.me.build-override]
opt-level     = 0
debug         = false
codegen-units = 256
incremental   = false
strip         = "none"

[profile.native]
inherits = "release"
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
incremental = false
panic = "abort"
strip = "symbols"

[profile.native.package."*"]
opt-level = 3

# ============================================================
# PORTABLE
# Generic x86-64 baseline.
# ============================================================

[profile.portable]
inherits = "release"
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
incremental = false
panic = "abort"
strip = "symbols"

[profile.portable.package."*"]
opt-level = 3

# ============================================================
# RELEASE
# Maximum optimized fallback.
# ============================================================

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
incremental = false
panic = "abort"
strip = "symbols"

[profile.release.build-override]
opt-level = 0
debug = false
codegen-units = 256
incremental = false
strip = "none"

[profile.bench]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
